# This is an example neoforge.mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
#
# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader="javafml"
# A version range to match for said mod loader - for regular FML @Mod it will be the forge version# Forge for 1.20.1 is version 47
loaderVersion="[1,)"
license="All rights reserved"

[[mods]]
# The modid of the mod
modId="examplemod"
# The version number of the mod - there's a few well known ${} variables useable here or just hardcode it# ${file.jarVersion} will substitute the value of the Implementation-Version as read from the mod's JAR file metadata
# see the associated build.gradle script for how to populate this completely automatically during a build
version="${file.jarVersion}"
# A display name for the mod
displayName="Example Mod"
# A URL for the "homepage" for this mod, displayed in the mod UI
displayURL="https://example.com/"
# A file name (in the root of the mod JAR) containing a logo for display#logoFile="examplemod.png"
# A text field displayed in the mod UI#credits="Thanks for this example mod goes to Java"
# A text field displayed in the mod UI#authors="Love, Cheese and small house plants"
# The description text for the mod (multi line!) (#mandatory)
description='''
This is an example mod that demonstrates the NeoForge modding system.
'''

[[dependencies.examplemod]]
modId="neoforge"
type="required"
versionRange="[20.4.217,)"
ordering="NONE"
side="BOTH"

[[dependencies.examplemod]]
modId="minecraft"
type="required"
versionRange="[1.21.1]"
ordering="NONE"
side="BOTH"