plugins {
    id 'net.neoforged.gradle.userdev' version '6.0.125'
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    mavenCentral()
}

extraProperties {
    minecraft_version = '1.21.1'
    loader_version = '20.4.217'
    mod_version = '1.0.0'
    maven_group = 'com.example'
    archives_base_name = 'examplemod'
}

neoforge {
    runs {
        client {
            main = 'com.examplemod.ExampleMod'
        }
        server {
            main = 'com.examplemod.ExampleMod'
        }
    }
}